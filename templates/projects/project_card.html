{% load static %}<article class="project-card">
  <div class="project-card-top"><span>{{ project.created_at|date:"M Y" }}</span><span class="public-dot">Public</span></div>
  <h3><a href="{{ project.get_absolute_url }}">{{ project.title }}</a></h3>
  <p>{{ project.description|truncatechars:125 }}</p>
  <img class="card-badge" src="{% static project.primary_image %}" alt="{{ project.get_primary_badge_display }} disclosure badge">
</article>
